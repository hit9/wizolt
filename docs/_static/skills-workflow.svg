<svg xmlns="http://www.w3.org/2000/svg" width="760" height="356" viewBox="0 0 760 356" role="img">
<title>Write once, use when needed</title>
<style>text{font-family:Georgia,serif;fill:#c9ccd1}.detail{font-size:18px;fill:#a2a9b3}.heading{font-size:23px;fill:#e8eaed}.number{font-family:monospace;font-size:14px;fill:#8b929c}</style>
<text x="16" y="37" class="number">01</text>
<text x="58" y="38" class="heading">Install a skill</text>
<text x="58" y="68" class="detail">Put instructions in .wizolt/skills/release-notes/SKILL.md</text>
<path d="M24 54 v53 m-4 -4 l4 4 4 -4" fill="none" stroke="#59616c" stroke-width="1"/>
<text x="16" y="139" class="number">02</text>
<text x="58" y="140" class="heading">Invoke /release-notes</text>
<text x="58" y="170" class="detail">Or let the agent load it when it fits the task.</text>
<path d="M24 156 v53 m-4 -4 l4 4 4 -4" fill="none" stroke="#59616c" stroke-width="1"/>
<text x="16" y="241" class="number">03</text>
<text x="58" y="242" class="heading">Follow the instructions</text>
<text x="58" y="272" class="detail">Read commits → group changes → draft release notes</text>
<path d="M58 311 H728" stroke="#2c3138"/>
<text x="58" y="340" class="detail" font-style="italic">Only the short description is shown until the skill is used.</text></svg>
