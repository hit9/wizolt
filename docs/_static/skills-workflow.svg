<svg xmlns="http://www.w3.org/2000/svg" width="760" height="472" viewBox="0 0 760 472" role="img">
<title>Write once, use when needed</title>
<style>text{font-family:system-ui,sans-serif;fill:#dce5ef}.detail{font-size:17px;fill:#acb9c9}.heading{font-size:21px;font-weight:600}</style>
<rect width="760" height="472" rx="12" fill="#1c2531"/>
<text x="32" y="30" font-size="12" letter-spacing="2" fill="#97acc5">CONCEPT DIAGRAM</text>
<text x="32" y="64" class="heading">Write once, use when needed</text>
<rect x="32" y="86" width="696" height="84" rx="8" fill="#273749" stroke="#49617e"/>
<circle cx="61" cy="115" r="13" fill="#99badd"/>
<text x="61" y="121" text-anchor="middle" style="fill:#182533;font-size:16px">1</text>
<text x="86" y="121" class="heading">Install a skill</text>
<text x="86" y="149" class="detail">Put instructions in .wizolt/skills/release-notes/SKILL.md</text>
<path d="M380 170 v20 m-6 -6 l6 6 6 -6" fill="none" stroke="#91a9c5" stroke-width="2"/>
<rect x="32" y="198" width="696" height="84" rx="8" fill="#273749" stroke="#49617e"/>
<circle cx="61" cy="227" r="13" fill="#99badd"/>
<text x="61" y="233" text-anchor="middle" style="fill:#182533;font-size:16px">2</text>
<text x="86" y="233" class="heading">Invoke /release-notes</text>
<text x="86" y="261" class="detail">Or let the agent load it when it fits the task.</text>
<path d="M380 282 v20 m-6 -6 l6 6 6 -6" fill="none" stroke="#91a9c5" stroke-width="2"/>
<rect x="32" y="310" width="696" height="84" rx="8" fill="#273749" stroke="#49617e"/>
<circle cx="61" cy="339" r="13" fill="#99badd"/>
<text x="61" y="345" text-anchor="middle" style="fill:#182533;font-size:16px">3</text>
<text x="86" y="345" class="heading">Follow the instructions</text>
<text x="86" y="373" class="detail">Read commits → group changes → draft release notes</text>
<text x="32" y="450" class="detail">Only the short description is shown until the skill is used.</text></svg>
