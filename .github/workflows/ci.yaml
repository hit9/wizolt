name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Python 3.15: tried "3.15t-dev" (RC track) once; the dependency chain fastmcp-slim[client]
        # -> py-key-value-aio -> beartype fails to import on 3.15 (beartype still pulls
        # typing.no_type_check_decorator, removed in 3.15). Add "3.15" once beartype ships a
        # 3.15-compatible release, ideally at the October release.
        python-version: ["3.11", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install terminal test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
          # The scrollback tests depend on how this exact tmux reflows a pane, so make the
          # version visible in the log: a silent distro bump would otherwise be invisible
          # until it broke something. The `tmux-latest` job covers the other end of the range.
          tmux -V

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run lint and type checks
        run: |
          uv run ruff check .
          uv run ruff format --check wizolt
          uv run pyright

      - name: Run tests
        run: uv run pytest -n 4

  # The scrollback projection is built on measured tmux behaviour -- that a top-anchored scroll
  # region feeds native history, and that a pane keeps its cursor line at the bottom across a
  # reflow. The matrix above only ever sees whatever tmux the runner image ships (3.4 on Ubuntu
  # 24.04), which trails releases by years, so this job builds the current tmux and runs the
  # acceptance tests against it. Bump TMUX_VERSION when a new tmux is released.
  tmux-latest:
    runs-on: ubuntu-latest
    env:
      TMUX_VERSION: "3.7c"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build tmux ${{ env.TMUX_VERSION }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libevent-dev libncurses-dev bison pkg-config
          curl -sSL -o tmux.tar.gz "https://github.com/tmux/tmux/releases/download/${TMUX_VERSION}/tmux-${TMUX_VERSION}.tar.gz"
          tar xzf tmux.tar.gz
          cd "tmux-${TMUX_VERSION}"
          ./configure --prefix=/usr/local
          make -j"$(nproc)"
          sudo make install
          hash -r
          tmux -V

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run the real-tmux acceptance tests
        run: uv run pytest tests/test_tui_tmux_scrollback.py -q
