name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Python 3.15: tried "3.15t-dev" (RC track) once; the dependency chain fastmcp-slim[client]
        # -> py-key-value-aio -> beartype fails to import on 3.15 (beartype still pulls
        # typing.no_type_check_decorator, removed in 3.15). Add "3.15" once beartype ships a
        # 3.15-compatible release, ideally at the October release.
        python-version: ["3.11", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run lint and type checks
        run: |
          uv run ruff check .
          uv run ruff format --check wizolt
          uv run pyright

      - name: Run tests
        run: uv run pytest -n 4

  # The scrollback projection is built on measured tmux behaviour -- that a top-anchored scroll
  # region feeds native history, and that a pane keeps its cursor line at the bottom across a
  # reflow. Those tests need a real terminal and real time, so the matrix above excludes them; the
  # two tmux jobs below own them, one at each end of the version range.
  tmux-shipped:
    runs-on: ubuntu-latest
    env:
      WIZOLT_REQUIRE_TMUX: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the distribution tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
          # The scrollback tests depend on how this exact tmux reflows a pane, so make the
          # version visible in the log: a silent distro bump would otherwise be invisible
          # until it broke something.
          tmux -V

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run the real-tmux acceptance tests
        run: uv run pytest -q -m tmux --basetemp="$RUNNER_TEMP/tmux-tests"

      - name: Upload terminal traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tmux-shipped-terminal-traces
          path: ${{ runner.temp }}/tmux-tests
          if-no-files-found: ignore
          retention-days: 7

  # Run the shared terminal scenarios against an attached Zellij client in its own PTY.
  # Pin both the release and archive checksum so terminal behavior cannot change silently.
  zellij:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ZELLIJ_VERSION: "0.45.1"
      ZELLIJ_SHA256: "40bcc2e03f5d5ae8e054e39f676081fe12ab70871506996ba595834c3718eefc"
      WIZOLT_REQUIRE_ZELLIJ: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Zellij ${{ env.ZELLIJ_VERSION }}
        run: |
          curl -fSL --retry 3 -o "$RUNNER_TEMP/zellij.tar.gz" "https://github.com/zellij-org/zellij/releases/download/v${ZELLIJ_VERSION}/zellij-x86_64-unknown-linux-musl.tar.gz"
          echo "$ZELLIJ_SHA256  $RUNNER_TEMP/zellij.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/zellij-bin"
          tar xzf "$RUNNER_TEMP/zellij.tar.gz" -C "$RUNNER_TEMP/zellij-bin"
          echo "$RUNNER_TEMP/zellij-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/zellij-bin/zellij" --version

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run the real-Zellij acceptance tests
        run: uv run pytest -q -m zellij -n 2 --basetemp="$RUNNER_TEMP/zellij-tests"

      - name: Upload terminal traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zellij-terminal-traces
          path: ${{ runner.temp }}/zellij-tests
          if-no-files-found: ignore
          retention-days: 7

  # The other end of the range: the distro tmux above trails releases by years, so this job builds
  # the current one and runs the same acceptance tests against it. Bump TMUX_VERSION when a new
  # tmux is released.
  tmux-latest:
    runs-on: ubuntu-latest
    env:
      TMUX_VERSION: "3.7c"
      WIZOLT_REQUIRE_TMUX: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build tmux ${{ env.TMUX_VERSION }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libevent-dev libncurses-dev bison pkg-config
          curl -sSL -o tmux.tar.gz "https://github.com/tmux/tmux/releases/download/${TMUX_VERSION}/tmux-${TMUX_VERSION}.tar.gz"
          tar xzf tmux.tar.gz
          cd "tmux-${TMUX_VERSION}"
          ./configure --prefix=/usr/local
          make -j"$(nproc)"
          sudo make install
          hash -r
          tmux -V

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run the real-tmux acceptance tests
        run: uv run pytest -q -m tmux --basetemp="$RUNNER_TEMP/tmux-tests"

      - name: Upload terminal traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tmux-latest-terminal-traces
          path: ${{ runner.temp }}/tmux-tests
          if-no-files-found: ignore
          retention-days: 7
